<mat-toolbar color="primary" class="barra-topo">
  <span class="titulo-app">Catálogo Musical</span>

  <nav class="links-navegacao">
    <a mat-button routerLink="/login" routerLinkActive="ativo">
      <mat-icon>login</mat-icon>
      Login
    </a>
    <a mat-button routerLink="/admin/painel-recentes" routerLinkActive="ativo">
      <mat-icon>dashboard</mat-icon>
      Painel Recentes
    </a>
    <a mat-button routerLink="/admin/catalogo-geral" routerLinkActive="ativo">
      <mat-icon>library_music</mat-icon>
      Catálogo Geral
    </a>
    <a mat-button routerLink="/admin/central-cadastros" routerLinkActive="ativo">
      <mat-icon>add_circle</mat-icon>
      Central Cadastros
    </a>
  </nav>

  <div class="acoes-teste">
    <button mat-stroked-button type="button" (click)="loginAdmin()">
      Testar Admin
    </button>
    <button mat-stroked-button type="button" (click)="loginUsuario()">
      Testar Usuário
    </button>
    <button mat-icon-button type="button" title="Sair" (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</mat-toolbar>

<!-- Aparece automaticamente sempre que catalogoService.carregando$ emitir true -->
@if (carregando$ | async) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<main class="conteudo-principal">
  <router-outlet />
</main>
