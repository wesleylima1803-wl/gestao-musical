<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Sistema Musical</mat-card-title>
      <mat-card-subtitle>Faça login com seu e-mail e senha</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="entrar()" class="login-form">
        <mat-form-field>
          <mat-label>E-mail</mat-label>
          <input matInput type="email" formControlName="email" placeholder="email@email.com" />

          @if (form.controls.email.hasError('required')) {
            <mat-error>O e-mail é obrigatório.</mat-error>
          } @else if (form.controls.email.hasError('email')) {
            <mat-error>Digite um e-mail válido.</mat-error>
          }
        </mat-form-field>

        <mat-form-field>
          <mat-label>Senha</mat-label>
          <input matInput type="password" formControlName="senha" />

          @if (form.controls.senha.hasError('required')) {
            <mat-error>A senha é obrigatória.</mat-error>
          }
        </mat-form-field>

        <button
          type="submit"
          class="btn-entrar"
          [disabled]="form.invalid || carregando">

          @if (carregando) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            <span>Entrar</span>
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
